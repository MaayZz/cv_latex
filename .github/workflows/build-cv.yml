name: Build LaTeX CV

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up LaTeX
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex

      - name: Prepare PDF for release branch
        run: |
          mkdir -p /tmp/cv_release
          cp main.pdf /tmp/cv_release/main.pdf

      - name: Create release branch with only PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Create/checkout an orphan release branch (no history)
          git checkout --orphan temp_release
          
          # Remove everything from the git index and working directory
          git rm -rf .
          
          # Remove any untracked pdf or log files that might be owned by root
          sudo rm -f main.pdf main.aux main.log main.out
          
          # Copy only the compiled PDF from temp directory
          cp /tmp/cv_release/main.pdf .
          
          # Add and commit only the PDF file
          git add main.pdf
          git commit -m "Update CV PDF"
          
          # Force push to release branch
          git push -f origin temp_release:release

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automated CV PDF build." \
            "./main.pdf" 